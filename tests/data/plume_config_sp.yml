plugins:
  - name: "EEPlugin"
    lib: "extreme_event_plugin_sp"
    parameters:
      - &extreme_wind
        - name: "u"
          type: "ATLAS_FIELD"
        - name: "v"
          type: "ATLAS_FIELD"
      - &100m_wind
        - name: "u"
          type: "ATLAS_FIELD"
          height: 100
        - name: "v"
          type: "ATLAS_FIELD"
          height: 100
      - &waves
        - name: "swh"
          type: "ATLAS_FIELD"
      - &temperatureRamp
        - name: "2t"
          type: "ATLAS_FIELD"
    core-config:
        aviso_url: "test"
        notify_endpoint: "/test"
        enable_notification: true
        healpix_res: 8
        events:
          - name: "extreme_wind"
            enabled: true
            required_params: *extreme_wind
            instances:
              - lower_bound: 0.0
                upper_bound: 0.5
                model_levels: [1, 2]
                description: "No wind"
          - name: "extreme_wind"
            enabled: true
            required_params: *100m_wind
            instances:
              - lower_bound: 25.0
                upper_bound: 0.0
                description: "Extremely strong wind"
          - name: "storm"
            enabled: true
            required_params: *100m_wind
            wind_speed_cutout: 20.0
            time_window: 60
          - name: "extreme_wave"
            enabled: true
            required_params: *waves
            instances:
              - threshold: 8.0
                description: "Storm conditions"
              - threshold: 3.5
                description: "Unsafe offshore wind-farm operations"
          - name: "wind_drought"
            enabled: true
            required_params: *100m_wind
            wind_speed_cutout: 2.0
            time_window: 15
          - name: "ramp"
            enabled: true
            required_params: *temperatureRamp
            ramp_up_value: 10.0
            time_window: 60